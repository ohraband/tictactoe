name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # lets release.yml reuse these checks as a gate

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}", cache: npm }
      - run: npm ci
      - run: npm test

  integration:
    name: Database and Redis tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tictactoe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d tictactoe_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/tictactoe_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test # runs everything, including the real Postgres and Redis tests

  docker:
    name: Docker build and smoke test
    needs: [typecheck, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose --profile observability --profile redis config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tictactoe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name game -p 3000:3000 tictactoe:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/api/ready && break
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health
          curl -fsS -o /dev/null http://localhost:3000/shared/protocol.js
          docker stop --time 15 game
          test "$(docker inspect game --format '{{.State.ExitCode}}')" = "0" # graceful shutdown exits 0
      - name: Show logs on failure
        if: failure()
        run: docker logs game
